name: Android release verification
on:
  push:
    branches:
      - android/verify-release-config-0400761
permissions:
  contents: read
concurrency:
  group: android-release-verification
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
            ndk;28.2.13676358
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          cache: true
      - name: Build Wiki reader assets
        run: |
          pnpm install --frozen-lockfile
          pnpm generate
          node mobile/scripts/build-native-data.mjs
          node mobile/scripts/build-tools.mjs
          python3 mobile/scripts/build-reader.py
      - name: Test Flutter client
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter test
      - name: Build signed architecture APKs
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?Missing Android release keystore}"

          : "${ANDROID_STORE_PASSWORD:?Missing Android keystore password}"

          : "${ANDROID_KEY_ALIAS:?Missing Android signing key alias}"

          : "${ANDROID_KEY_PASSWORD:?Missing Android signing key password}"

          export ANDROID_KEYSTORE_PATH="$(mktemp
          "$RUNNER_TEMP/wiki-android-key.XXXXXX")"

          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >
          "$ANDROID_KEYSTORE_PATH"

          chmod +x android/gradlew

          flutter build apk --release --no-pub --split-per-abi --target-platform
          android-arm64,android-x64
      - name: Stage APKs and update manifest
        env:
          RELEASE_TAG: android-v0.6.11
        run: >
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$(sed -n 's/^version: *\([^+ ]*\)+.*/\1/p' mobile/pubspec.yaml)"
            RELEASE_TAG="android-v$version"
          fi

          python3 mobile/scripts/publish-update.py stage \
            --apk-dir mobile/build/app/outputs/flutter-apk --output "$RUNNER_TEMP/wiki-android-release" \
            --tag "$RELEASE_TAG" --notes mobile/release-notes.txt \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Verify release certificate against R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_PAGER: ""
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >
          set -euo pipefail

          aws --endpoint-url "$R2_ENDPOINT" s3api get-object --bucket
          wust-wiki-downloads --key wiki/latest.json
          "$RUNNER_TEMP/wiki-published-release.json" > /dev/null

          python3 - "$RUNNER_TEMP/wiki-android-release/latest.json"
          "$RUNNER_TEMP/wiki-published-release.json" <<'PY'

          import json, sys

          from pathlib import Path

          built, published = [json.loads(Path(path).read_text(encoding="utf-8"))
          for path in sys.argv[1:]]

          if built["signerSha256"] != published["signerSha256"]:
              raise SystemExit("GitHub signing certificate differs from the active Android release.")
          if built["packageName"] != published["packageName"]:
              raise SystemExit("GitHub package identity differs from the active Android release.")
          print("Verified the signed APKs against the active certificate and
          authenticated read of the R2 manifest.")

          PY
