server {
    listen 80;
    server_name schedule.wiki.jianges.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/schedule.wiki.jianges.com/acme;
    }
    location / { return 301 https://schedule.wiki.jianges.com$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name schedule.wiki.jianges.com;
    ssl_certificate /www/sites/schedule.wiki.jianges.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/schedule.wiki.jianges.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/schedule-error.log warn;
    client_max_body_size 2k;
    add_header Strict-Transport-Security "max-age=2592000" always;
    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host schedule.wiki.jianges.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
